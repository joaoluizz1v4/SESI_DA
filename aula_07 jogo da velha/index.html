<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="text1">
        <h1>Jogo da Velha</h1>
    </div>

    <div class="painel-jogadores">
        <div class="campo-jogador">
            <label for="jogadorX">Jogador 1 (X):</label>
            <input type="text" id="jogadorX" placeholder="Nome do Jogador X" value="Jogador X">
        </div>
        <div class="campo-jogador">
            <label for="jogadorO">Jogador 2 (O):</label>
            <input type="text" id="jogadorO" placeholder="Nome do Jogador O" value="Jogador O">
        </div>
    </div>

    <div id="status">Vez de: <span id="nome-vez">Jogador X</span> (X)</div>

    <div class="tabuleiro">
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
        <div class="casa"></div>
    </div>

    <div class="container-btn">
        <button id="btn-reiniciar">Reiniciar Partida</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
